[project]
name = "cost-signals-api"
version = "0.1.0"
description = "Cost Signals detection and narration service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.141,<1",
  "pandas>=3.0,<4",
  "numpy>=2,<3",
  "anthropic>=1.5,<2",
  "pydantic>=2,<3",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "uvicorn>=0.30",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
